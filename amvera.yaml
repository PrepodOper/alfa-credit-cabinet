# Конфигурация Amvera Cloud (https://docs.amvera.ru/applications/configuration/config-file.html)
#
# Приложение разворачивается ОДНИМ контейнером: FastAPI раздаёт и API, и собранный
# фронтенд. Поэтому вместо docker-compose.yml используется Dockerfile.allinone.
#
# Важные параметры:
#   run.containerPort     — порт, который слушает uvicorn (по умолчанию Amvera ждёт 80,
#                           а наше приложение слушает 8000 → без этой строки будет 503);
#   run.persistenceMount  — куда монтируется папка Data; SQLite пишется в /data/credit_cabinet.db.
meta:
  environment: docker
  toolchain:
    name: docker
    version: latest

build:
  dockerfile: Dockerfile.allinone

run:
  persistenceMount: /data
  containerPort: 8000
